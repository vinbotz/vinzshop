<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order VinzShop</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>💖 ORDER VINZSHOP</h1>
      
    <a
        href="pricelist.html"
        class="pricelist-btn"
            >
            💸 Lihat Price List
        </a>

      <form id="orderForm">
        <select id="region" required>
          <option value="">Pilih negara / Select country</option>
          <option value="indo">🇮🇩 Indonesia (Rupiah)</option>
          <option value="malay">🇲🇾 Malaysia (Ringgit)</option>
        </select>

        <select id="method" required disabled>
          <option value="">Pilih metode / Select method</option>
        </select>

        <!-- FORM DINAMIS -->
        <div id="dynamicForm"></div>

        <button type="submit">✨ Buat Order</button>

        <button type="button" id="refreshBtn">🔄 Refresh Halaman</button>
      </form>

      <br />

      <select id="tutorialSelect">
        <option value="">📚 Pilih Tutorial</option>

        <option value="gamepass">Tutorial Gamepass</option>

        <option value="vilog">Tutorial VILOG</option>

        <option value="tng">Cara Pembayaran TNG</option>
      </select>

      <video
        id="tutorialVideo"
        controls
        width="100%"
        style="margin-top: 20px; border-radius: 16px; display: none"
      ></video>

      <div id="statusBox"></div>

      <!-- POPUP PAYMENT -->
      <div id="paymentModal" class="modal">
        <div class="modal-content">
          <span class="closeModal" onclick="closePaymentModal()"> ✖ </span>

          <div id="paymentContent"></div>
        </div>
      </div>

      <div id="liveChatArea"></div>

      <!-- LIVE CHAT -->
      <div class="chat-container">
        <h2>💬 LIVE CHAT</h2>

        <div id="chatBox"></div>

        <form id="chatForm">
          <input type="text" id="chatInput" placeholder="Ketik pesan..." />

          <button type="submit">Kirim</button>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 VinzShop. All rights reserved.</p>
    </footer>

    <script>
      const tutorialSelect = document.getElementById("tutorialSelect");
      const tutorialVideo = document.getElementById("tutorialVideo");

      const tutorialVideos = {
        gamepass: "./videos/tutorial-gamepass.mp4",
        vilog: "./videos/tutorial-vilog.mp4",
        tng: "./videos/tutorial-tng.mp4",
      };

      if (tutorialSelect && tutorialVideo) {
        tutorialSelect.addEventListener("change", () => {
          const selected = tutorialSelect.value;

          if (!selected || !tutorialVideos[selected]) {
            tutorialVideo.pause();
            tutorialVideo.removeAttribute("src");
            tutorialVideo.load();
            tutorialVideo.style.display = "none";
            return;
          }

          tutorialVideo.src = tutorialVideos[selected];
          tutorialVideo.style.display = "block";
          tutorialVideo.load();
          tutorialVideo.play().catch(() => {});
        });
      }
    </script>

    <script type="module" src="./js/order-form.js"></script>

    <script type="module" src="./js/order.js"></script>

    <script type="module" src="./js/chat.js"></script>
  </body>
</html>
