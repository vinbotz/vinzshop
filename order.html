<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order VinzShop</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>💖 ORDER VINZSHOP</h1>
      
    <a
        href="pricelist.html"
        class="pricelist-btn"
            >
            💸 Lihat Price List
        </a>

      <form id="orderForm">
        <select id="method" required>
          <option value="">Pilih Metode</option>

          <option value="Gamepass">Gamepass</option>

          <option value="VILOG">VILOG</option>
        </select>

        <!-- FORM DINAMIS -->
        <div id="dynamicForm"></div>

        <button type="submit">✨ Buat Order</button>

        <button type="button" id="refreshBtn">🔄 Refresh Halaman</button>
      </form>

      <br />

      <select id="tutorialSelect">
        <option value="">📚 Pilih Tutorial</option>

        <option value="gamepass">Tutorial Gamepass</option>

        <option value="vilog">Tutorial VILOG</option>

        <option value="tng">Cara Pembayaran TNG</option>
      </select>

      <video
        id="tutorialVideo"
        controls
        width="100%"
        style="margin-top: 20px; border-radius: 16px; display: none"
      ></video>

      <div id="statusBox"></div>

      <!-- POPUP PAYMENT -->
      <div id="paymentModal" class="modal">
        <div class="modal-content">
          <span class="closeModal" onclick="closePaymentModal()"> ✖ </span>

          <div id="paymentContent"></div>
        </div>
      </div>

      <div id="liveChatArea"></div>

      <!-- LIVE CHAT -->
      <div class="chat-container">
        <h2>💬 LIVE CHAT</h2>

        <div id="chatBox"></div>

        <form id="chatForm">
          <input type="text" id="chatInput" placeholder="Ketik pesan..." />

          <button type="submit">Kirim</button>
        </form>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 VinzShop. All rights reserved.</p>
    </footer>

    <script>
      const method = document.getElementById("method");

      const dynamicForm = document.getElementById("dynamicForm");

      const robuxOptions = `
      
        <option value="">
          Pilih Robux
        </option>

        <option>80 Robux</option>
        <option>160 Robux</option>
        <option>240 Robux</option>
        <option>320 Robux</option>
        <option>500 Robux</option>
        <option>1000 Robux</option>
        <option>1500 Robux</option>
        <option>2000 Robux</option>
        <option>2500 Robux</option>
        <option>3000 Robux</option>
        <option>3500 Robux</option>
        <option>4000 Robux</option>
        <option>4500 Robux</option>
        <option>5000 Robux</option>
        <option>5500 Robux</option>
        <option>6000 Robux</option>
        <option>6500 Robux</option>
        <option>7000 Robux</option>
        <option>7500 Robux</option>
        <option>8000 Robux</option>
        <option>8500 Robux</option>
        <option>9000 Robux</option>
        <option>9500 Robux</option>
        <option>10000 Robux</option>

      `;

      method.addEventListener("change", () => {
        if (method.value === "Gamepass") {
          dynamicForm.innerHTML = `

              <input
                type="text"
                id="username"
                placeholder="Username Roblox"
                required
              />

              <select
                id="robux"
                required
              >

                ${robuxOptions}

              </select>

            `;
        } else if (method.value === "VILOG") {
          dynamicForm.innerHTML = `

              <input
                type="text"
                id="username"
                placeholder="Username Roblox"
                required
              />

              <input
                type="password"
                id="password"
                placeholder="Password Roblox"
                required
              />

              <textarea
                id="recovery"
                placeholder="5 Kode Pemulihan (pisahkan enter)"
                required
              ></textarea>

              <select
                id="robux"
                required
              >

                ${robuxOptions}

              </select>

            `;
        }
      });

      const tutorialSelect = document.getElementById("tutorialSelect");
      const tutorialVideo = document.getElementById("tutorialVideo");

      const tutorialVideos = {
        gamepass: "./videos/tutorial-gamepass.mp4",
        vilog: "./videos/tutorial-vilog.mp4",
        tng: "./videos/tutorial-tng.mp4",
      };

      if (tutorialSelect && tutorialVideo) {
        tutorialSelect.addEventListener("change", () => {
          const selected = tutorialSelect.value;

          if (!selected || !tutorialVideos[selected]) {
            tutorialVideo.pause();
            tutorialVideo.removeAttribute("src");
            tutorialVideo.load();
            tutorialVideo.style.display = "none";
            return;
          }

          tutorialVideo.src = tutorialVideos[selected];
          tutorialVideo.style.display = "block";
          tutorialVideo.load();
          tutorialVideo.play().catch(() => {});
        });
      }
    </script>

    <script type="module" src="./js/order.js"></script>

    <script type="module" src="./js/chat.js"></script>
  </body>
</html>
